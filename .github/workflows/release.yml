name: Release

on:
  push:
    branches: [main, dev]
    paths:
      - "app/**"
      - "firmware/**"
      - "gradle/**"
      - "*.gradle*"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Check for firmware changes
        if: github.ref == 'refs/heads/main'
        id: firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN=Sharktooth-usb-bridge-c3.bin
          PREV_TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          BUILD=true
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release — building firmware."
          elif ! git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            echo "Tag $PREV_TAG not found locally — building firmware."
          elif ! git diff --quiet "$PREV_TAG" HEAD -- firmware/; then
            echo "firmware/ changed since $PREV_TAG — building firmware."
          elif gh release download "$PREV_TAG" -p "$BIN" -D firmware --clobber; then
            echo "firmware/ unchanged since $PREV_TAG — reusing its $BIN."
            BUILD=false
          else
            echo "Could not download $BIN from $PREV_TAG — building firmware."
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.firmware.outputs.build == 'true'
        with:
          python-version: "3.12"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version
        id: version
        run: |
          NAME="$(date -u +'%Y.%m.%d-%H%M%S')"
          # Seconds since 2020-01-01 UTC; shared by dev and stable for compatible upgrades.
          CODE="$(( $(date -u +%s) - 1577836800 ))"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "tag=dev-v${NAME}-dev" >> "$GITHUB_OUTPUT"
            echo "variant=dev" >> "$GITHUB_OUTPUT"
            echo "task=assembleDev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64. See README (Release signing)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"

      - name: Test updater and build signed APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. See README (Release signing)."
            exit 1
          fi
          ./gradlew :app:testDebugUnitTest --tests 'com.sphy.airconcontroller.update.AppUpdaterTest' \
            :app:${{ steps.version.outputs.task }} \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename APK
        run: |
          mkdir -p dist
          APK="app/build/outputs/apk/${{ steps.version.outputs.variant }}/app-${{ steps.version.outputs.variant }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected signed APK at $APK — check signing secrets / Gradle signingConfig."
            exit 1
          fi
          mv "$APK" dist/Sharktooth.apk
          cp dist/Sharktooth.apk dist/open-dikey.apk

      - name: Install PlatformIO
        if: steps.firmware.outputs.build == 'true'
        run: pip install -U platformio

      - name: Build firmware
        if: steps.firmware.outputs.build == 'true'
        working-directory: firmware
        run: pio run

      - name: Package firmware and compatibility copy
        if: github.ref == 'refs/heads/main'
        run: |
          cp firmware/Sharktooth-usb-bridge-c3.bin dist/Sharktooth-usb-bridge-c3.bin
          cp dist/Sharktooth-usb-bridge-c3.bin dist/dikey-usb-bridge-c3.bin

      - name: Create dev prerelease
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sharktooth ${{ steps.version.outputs.tag }}
          body: |
            Head-unit dev build from `${{ github.sha }}`. Uses real vehicle controls.
            Install `Sharktooth.apk` once to opt into dev updates, then use Settings → Updates → Check for updates.
            Signed with the public release key; keeps the same package and app data.
            Public release builds do not offer these prereleases.
            `open-dikey.apk` is an identical compatibility copy for older app updaters.
          files: |
            dist/Sharktooth.apk
            dist/open-dikey.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          make_latest: false

      - name: Create stable release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sharktooth ${{ steps.version.outputs.tag }}
          body: |
            ## Installation

            1. Flash `Sharktooth-usb-bridge-c3.bin` onto an ESP32-C3 Super Mini
            2. Install `Sharktooth.apk` on the DiLink 5 head unit

            The old filenames are identical compatibility copies for existing users.

            See the [README](https://github.com/DJS91/Sharktooth#app-installation) for details.

            **Version:** `${{ steps.version.outputs.name }}` (code `${{ steps.version.outputs.code }}`)
          files: |
            dist/Sharktooth.apk
            dist/open-dikey.apk
            dist/Sharktooth-usb-bridge-c3.bin
            dist/dikey-usb-bridge-c3.bin
          draft: false
          prerelease: false
          make_latest: true
